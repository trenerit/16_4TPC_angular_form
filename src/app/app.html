<form #formName="ngForm" (ngSubmit)="setNewName(formName)">
  <input type="text" ngModel name="firstname"><br>
  <button type="submit">Zapisz</button>
</form>

@for(elem of data; track $index) {
  <p>{{elem}} <button (click)="delElem($index)">usuń</button> <button (click)="modElem($index)">modyfikuj</button></p>
}
